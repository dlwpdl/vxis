[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vxis"
version = "0.2.0"
description = "AI-powered security automation platform"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.14.2,<3",
    "sqlalchemy>=2.0,<3",
    "greenlet>=3.0,<4",
    "alembic>=1.13,<2",
    "aiosqlite>=0.20,<1",
    "typer>=0.15,<1",
    "rich>=13.0,<16",
    "jinja2>=3.1,<4",
    "PyYAML>=6.0.2,<7",
    "dnspython>=2.7,<3",
    "InquirerPy>=0.3,<1",
    "anthropic>=0.40.0",
    "httpx[socks]>=0.28,<1",  # CPR Hands + Ghost SOCKS transport
    "h11>=0.16,<1",
    "textual>=6.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.8,<1",
    "vxis[sdk]",
]
dashboard = [
    "fastapi>=0.115,<1",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.34,<1",
]
export = [
    "python-docx>=1.1,<2",
]
browser = [
    "playwright>=1.49",  # CPR Eyes — Playwright + CDP 브라우저
]
proxy = [
    # mitmproxy 12.2.3 caps msgpack at a vulnerable version. Keep the
    # dependency-free passive X-Ray fallback until upstream accepts >=1.2.1.
]
sdk = [
    "openai-agents==0.14.6",
    "cryptography>=50.0.0",
]

[project.scripts]
vxis = "vxis.cli.main:app"
vxis-mcp = "vxis.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vxis"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "vxis/alembic.ini"
"alembic" = "vxis/alembic"

[tool.hatch.build.targets.sdist.force-include]
"alembic.ini" = "alembic.ini"
"alembic" = "alembic"

[tool.hatch.build]
include = [
    "src/vxis/**/*.py",
    "src/vxis/**/*.json",
    "src/vxis/**/*.html",
    "src/vxis/**/*.css",
    "src/vxis/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live: requires live LLM/network; excluded from the per-PR deterministic tier",
]

[tool.ruff]
target-version = "py312"
line-length = 100
