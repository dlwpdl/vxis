{% extends "base.html" %}

{% block title %}Knowledge Base — VXIS Dashboard{% endblock %}

{% block breadcrumb %}
<nav class="flex items-center gap-2 text-sm">
  <a href="/" class="text-gray-500 hover:text-gray-300">Dashboard</a>
  <span class="text-gray-600">/</span>
  <span class="text-gray-300">Knowledge Base</span>
</nav>
{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-white">Knowledge Base</h1>
    <p class="text-sm text-gray-500 mt-1">{{ total_entries }} remediation guides</p>
  </div>

  <input
    type="search"
    name="q"
    value="{{ query }}"
    placeholder="Search vulnerability, CWE, or OWASP category"
    hx-get="/kb/search"
    hx-trigger="input changed delay:250ms, search"
    hx-target="#kb-cards"
    class="w-full px-3 py-2 mb-5 rounded-md bg-gray-900 border border-surface-border text-gray-100 text-sm
           placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500"
  />

  <div id="kb-cards">
    {% include "partials/kb_cards.html" %}
  </div>
</div>
{% endblock %}
